name: Compilar Windows

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Tesseract para pruebas del ejecutable
        shell: pwsh
        run: |
          choco install tesseract --yes --no-progress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          'C:\Program Files\Tesseract-OCR' | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Dependencias
        run: |
          python -m pip install -r requirements.txt
          python -m pip install -e '.[dev,build]'
      - name: Pruebas en Windows
        run: python -m pytest -q
      - name: Empaquetar aplicación sin consola
        run: python -m PyInstaller --noconfirm --clean local_ocr.spec
      - name: Probar ejecutable con OCR real
        run: python scripts/smoke_frozen.py dist/LocalOCR/LocalOCR.exe
      - name: Agregar documentación
        shell: pwsh
        run: |
          Copy-Item README.md,THIRD_PARTY_NOTICES.md -Destination dist/LocalOCR/
          Copy-Item scripts/descargar_idiomas.ps1 -Destination dist/LocalOCR/
      - uses: actions/upload-artifact@v4
        with:
          name: LocalOCR-Windows-x64
          path: dist/LocalOCR/
          if-no-files-found: error
          retention-days: 14
