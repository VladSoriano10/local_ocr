name: Pruebas

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Componentes locales
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-spa libreoffice-writer libegl1 fonts-noto-core
      - name: Dependencias de Python
        run: python -m pip install -r requirements.txt '.[dev]'
      - name: Estilo
        run: |
          ruff check .
          ruff format --check .
      - name: Pruebas unitarias e integración real
        run: python -m pytest -q
